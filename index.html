<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>I have to know...</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon:#7A1F2B;
    --maroon-dark:#4E1119;
    --gold:#C9962C;
    --gold-soft:#E4C77E;
    --cream:#FBF1E2;
    --blush:#F3D4D0;
    --ink:#2B1512;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    min-height:100vh;
    background:var(--cream);
    background-image:
      radial-gradient(circle at 12% 15%, var(--blush) 0, transparent 35%),
      radial-gradient(circle at 88% 85%, var(--blush) 0, transparent 35%);
    font-family:'Hind Siliguri', sans-serif;
    color:var(--ink);
    overflow:hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #stage{
    position:relative;
    width:100vw;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .card{
    position:relative;
    width:100%;
    max-width:480px;
    padding:56px 32px 44px;
    text-align:center;
    border:1.5px solid var(--gold);
    outline:1px solid var(--gold-soft);
    outline-offset:6px;
    background:rgba(255,252,246,0.72);
    animation:riseIn 900ms cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes riseIn{
    from{opacity:0; transform:translateY(18px) scale(.98);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }
  .corner{
    position:absolute;
    width:34px;
    height:34px;
    border:1.5px solid var(--gold);
  }
  .corner.tl{top:10px;left:10px;border-right:none;border-bottom:none;}
  .corner.tr{top:10px;right:10px;border-left:none;border-bottom:none;}
  .corner.bl{bottom:10px;left:10px;border-right:none;border-top:none;}
  .corner.br{bottom:10px;right:10px;border-left:none;border-top:none;}

  .eyebrow-mark{
    font-size:22px;
    color:var(--gold);
    letter-spacing:2px;
    margin-bottom:14px;
  }
  h1{
    font-family:'Tiro Bangla', serif;
    font-weight:400;
    font-size:clamp(28px, 6vw, 40px);
    line-height:1.35;
    margin:0 0 10px;
    color:var(--maroon-dark);
  }
  .sub{
    font-size:15px;
    color:#8a5a5a;
    margin:0 0 38px;
  }

  .btn-row{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
    min-height:110px;
  }
  button{
    font-family:'Hind Siliguri', sans-serif;
    font-weight:600;
    border-radius:999px;
    cursor:pointer;
    border:none;
    touch-action:none;
  }
  #yesBtn{
    padding:16px 34px;
    font-size:19px;
    background:var(--maroon);
    color:var(--cream);
    box-shadow:0 6px 18px rgba(122,31,43,0.35);
    transition:transform 220ms ease, box-shadow 220ms ease, padding 220ms ease, font-size 220ms ease;
  }
  #yesBtn:hover{transform:translateY(-2px);}
  #noBtn{
    position:absolute;
    padding:14px 28px;
    font-size:16px;
    background:transparent;
    color:var(--maroon);
    border:1.5px solid var(--maroon);
    transition:transform 120ms ease, font-size 200ms ease, padding 200ms ease, opacity 200ms ease;
    will-change:left, top;
  }

  .taunt{
    min-height:22px;
    margin-top:20px;
    font-size:13.5px;
    color:#a3766f;
  }


  #successScreen{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:var(--maroon-dark);
    background-image:radial-gradient(circle at 50% 20%, var(--maroon) 0, var(--maroon-dark) 70%);
    text-align:center;
  }
  #successScreen.show{display:flex;}
  .success-inner{
    animation:riseIn 700ms ease both;
    max-width:480px;
  }
  .success-inner .mark{font-size:34px; margin-bottom:6px;}
  #successScreen h2{
    font-family:'Tiro Bangla', serif;
    font-weight:400;
    color:var(--gold-soft);
    font-size:clamp(26px, 6vw, 38px);
    line-height:1.4;
    margin:0 0 18px;
  }
  #successScreen p{
    color:#f3e4d6;
    font-size:16px;
    line-height:1.9;
    margin:0;
  }

  .heart{
    position:fixed;
    bottom:-40px;
    font-size:20px;
    color:var(--gold-soft);
    pointer-events:none;
    animation:floatUp linear forwards;
    opacity:0.9;
    z-index:5;
  }
  @keyframes floatUp{
    to{ transform:translateY(-110vh) rotate(20deg); opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    .card, .success-inner, .heart{ animation:none !important; }
  }
</style>
</head>
<body>

<div id="stage">
  <div class="card">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>

    <div class="eyebrow-mark">♥</div>
    <h1>Will you marry me?</h1>
    <p class="sub">Think about the answer...😄</p>

    <div class="btn-row" id="btnRow">
      <button id="yesBtn">yes,I will</button>
      <button id="noBtn">No</button>
    </div>

    <p class="taunt" id="taunt"></p>
  </div>
</div>

<div id="successScreen">
  <div class="success-inner">
    <div class="mark">♥</div>

    <h2>I knew you couldn't say "no"😊</h2>
    <p>
      Your "yes" will be the most beautiful word of my life.
I look forward to spending the rest of my life holding your hand.
I love you, still, as always.♥
    </p>
  </div>
</div>

<script>
  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');
  const btnRow = document.getElementById('btnRow');
  const taunt = document.getElementById('taunt');
  const successScreen = document.getElementById('successScreen');

  const taunts = [
    "Ugh, you can't get caught there😄",
    "Try more...",
    "Give up, just say yes♥"
  ];
  let dodgeCount = 0;
  const DODGE_THRESHOLD = 90; 

  function rectsOverlap(a, b, margin){
    return !(
      a.x + a.w + margin < b.x ||
      b.x + b.w + margin < a.x ||
      a.y + a.h + margin < b.y ||
      b.y + b.h + margin < a.y
    );
  }

  function randomPositionInside(container, btn, avoidBtn){
    const cRect = container.getBoundingClientRect();
    const aRect = avoidBtn.getBoundingClientRect();
    const bw = btn.offsetWidth, bh = btn.offsetHeight;
    const maxX = Math.max(cRect.width - bw, 0);
    const maxY = Math.max(cRect.height - bh, 0);

    const avoidRel = {
      x: aRect.left - cRect.left,
      y: aRect.top - cRect.top,
      w: aRect.width,
      h: aRect.height
    };

    let candidate;
    for (let attempt = 0; attempt < 30; attempt++){
      candidate = { x: Math.random() * maxX, y: Math.random() * maxY, w: bw, h: bh };
      if (!rectsOverlap(candidate, avoidRel, 18)){
        return candidate;
      }
    }
    return avoidRel.x > maxX - avoidRel.x - avoidRel.w
      ? { x: 0, y: candidate.y }
      : { x: maxX, y: candidate.y };
  }

  function dodge(){
    const pos = randomPositionInside(btnRow, noBtn, yesBtn);
    noBtn.style.left = pos.x + 'px';
    noBtn.style.top = pos.y + 'px';
    dodgeCount++;
    taunt.textContent = taunts[Math.min(dodgeCount - 1, taunts.length - 1)];

    const growth = Math.min(dodgeCount * 2, 26);
    yesBtn.style.fontSize = (19 + growth * 0.4) + 'px';
    yesBtn.style.padding = (16 + growth * 0.5) + 'px ' + (34 + growth) + 'px';

    const shrink = Math.max(16 - dodgeCount * 0.6, 11);
    noBtn.style.fontSize = shrink + 'px';
  }

  function initNoBtnPosition(){
    const yesRect = yesBtn.getBoundingClientRect();
    const rowRect = btnRow.getBoundingClientRect();
    noBtn.style.left = (yesRect.right - rowRect.left + 22) + 'px';
    noBtn.style.top = ((rowRect.height - noBtn.offsetHeight) / 2) + 'px';
  }
  window.addEventListener('load', initNoBtnPosition);

  function distanceToBtn(clientX, clientY, btn){
    const r = btn.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    return Math.hypot(clientX - cx, clientY - cy);
  }

  function handlePointer(clientX, clientY){
    if (distanceToBtn(clientX, clientY, noBtn) < DODGE_THRESHOLD){
      dodge();
    }
  }

  document.addEventListener('mousemove', (e) => handlePointer(e.clientX, e.clientY));

  document.addEventListener('touchmove', (e) => {
    for (const t of e.touches){
      handlePointer(t.clientX, t.clientY);
    }
  }, { passive:true });

  noBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    dodge();
  }, { passive:false });

  noBtn.addEventListener('click', (e) => {
    e.preventDefault();
    dodge();
  });

  yesBtn.addEventListener('click', () => {
    successScreen.classList.add('show');
    spawnHearts();
  });

  function spawnHearts(){
    const count = 26;
    for (let i = 0; i < count; i++){
      setTimeout(() => {
        const h = document.createElement('div');
        h.className = 'heart';
        h.textContent = '♥';
        h.style.left = Math.random() * 100 + 'vw';
        h.style.fontSize = (14 + Math.random() * 18) + 'px';
        h.style.animationDuration = (3.5 + Math.random() * 3) + 's';
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 7000);
      }, i * 90);
    }
  }
</script>

</body>
</html>
